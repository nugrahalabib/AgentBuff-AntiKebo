[package]
name = "antikebo-pc"
description = "AntiKebo untuk PC: alarm yang tidak bisa ditutup sebelum soal terjawab."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
default-run = "antikebo-pc"

[[bin]]
name = "antikebo-pc"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
antikebo-inti = { path = "../inti" }
antikebo-klien = { path = "../klien" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
rodio = { version = "0.20", default-features = false, features = ["wav", "mp3", "vorbis"] }
log = "0.4"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Core",
  "Media_SpeechSynthesis",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
