<!DOCTYPE html>
<html lang="id" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Shila Wake System</title>
    <meta name="color-scheme" content="dark">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            background: #0a0a0f;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            font: 400 14px/1.6 "Space Grotesk", -apple-system, sans-serif;
            color: #e0e0e0;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            background: radial-gradient(ellipse at 30% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(34, 211, 238, 0.06) 0%, transparent 50%),
                #0a0a0f;
        }

        .login-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 44px 36px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04);
            animation: card-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        @keyframes card-in {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 32px;
        }

        .login-logo .emoji {
            font-size: 48px;
            margin-bottom: 12px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        .login-logo h1 {
            font-family: "Space Grotesk", sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0;
            background: linear-gradient(135deg, #818cf8, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-logo p {
            margin: 6px 0 0;
            font-size: 13px;
            color: #737373;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #737373;
            margin-bottom: 5px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 11px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-family: "Space Grotesk", sans-serif;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-group input::placeholder {
            color: #404040;
        }

        .input-group input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .login-btn {
            margin-top: 6px;
            padding: 12px 0;
            background: linear-gradient(135deg, #6366f1 0%, #22d3ee 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: "Space Grotesk", sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s, opacity 0.2s;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.35);
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transform: translateX(-100%);
        }

        .login-btn:hover::after {
            animation: shimmer 0.8s forwards;
        }

        @keyframes shimmer {
            to {
                transform: translateX(100%);
            }
        }

        .error-msg {
            text-align: center;
            font-size: 13px;
            color: #ef4444;
            min-height: 18px;
            margin: 0;
            transition: opacity 0.2s;
        }

        .error-msg:empty {
            opacity: 0;
        }

        .shake {
            animation: shake 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-10px);
            }

            40% {
                transform: translateX(8px);
            }

            60% {
                transform: translateX(-6px);
            }

            80% {
                transform: translateX(4px);
            }
        }

        .login-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 11px;
            color: #404040;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
                border-radius: 16px;
            }

            .login-logo .emoji {
                font-size: 40px;
            }

            .login-logo h1 {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>
    <div class="login-wrap">
        <div class="login-card" id="loginCard">
            <div class="login-logo">
                <div class="emoji">🌅</div>
                <h1>SHILA WAKE</h1>
                <p>Smart Alarm System — Login Required</p>
            </div>
            <form class="login-form" id="loginForm" autocomplete="off">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Masukkan username"
                        autocomplete="username" required />
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password"
                        autocomplete="current-password" required />
                </div>
                <p class="error-msg" id="errorMsg"></p>
                <button type="submit" class="login-btn" id="loginBtn">Masuk</button>
            </form>
            <div class="login-footer">🔒 Dilindungi autentikasi server-side</div>
        </div>
    </div>
    <script>
        const form = document.getElementById('loginForm');
        const card = document.getElementById('loginCard');
        const errorMsg = document.getElementById('errorMsg');
        const loginBtn = document.getElementById('loginBtn');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if (!username || !password) return;
            loginBtn.disabled = true;
            loginBtn.textContent = 'Memverifikasi...';
            errorMsg.textContent = '';
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const data = await res.json();
                if (res.ok && data.ok) {
                    loginBtn.textContent = '✓ Berhasil';
                    loginBtn.style.background = '#22c55e';
                    setTimeout(() => { window.location.href = '/'; }, 400);
                } else {
                    errorMsg.textContent = data.error || 'Kredensial salah';
                    card.classList.remove('shake');
                    void card.offsetWidth;
                    card.classList.add('shake');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Masuk';
                }
            } catch (err) {
                errorMsg.textContent = 'Gagal terhubung ke server';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Masuk';
            }
        });
        document.getElementById('username').focus();
    </script>
</body>

</html>
